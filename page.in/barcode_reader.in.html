<style>
  #barcode-reader {
    --scanner-accent: #205c4c;
    --scanner-accent-hover: #164738;
    --scanner-accent-text: #fff;
    margin: 1.5rem 0;
  }

  @media (prefers-color-scheme: dark) {
    #barcode-reader {
      --scanner-accent: #8bc4a2;
      --scanner-accent-hover: #a7d8b7;
      --scanner-accent-text: #142019;
    }
  }

  #barcode-reader p {
    text-indent: 0;
  }

  #barcode-reader .scan-controls {
    display: flex;
    flex-wrap: wrap;
    align-items: end;
    gap: 0.75rem;
    margin-bottom: 1rem;
  }

  #barcode-reader .image-control {
    display: grid;
    gap: 0.25rem;
  }

  #barcode-reader input[type="file"] {
    max-width: 100%;
    color: var(--text-color);
  }

  #barcode-reader button {
    min-height: 2.5rem;
    margin: 0;
    padding: 0.45rem 0.8rem;
    border: 1px solid var(--border);
    border-radius: 3px;
    background: var(--offset-background);
    color: var(--text-color);
    font: inherit;
    cursor: pointer;
  }

  #barcode-reader button.primary {
    border-color: var(--scanner-accent);
    background: var(--scanner-accent);
    color: var(--scanner-accent-text);
  }

  #barcode-reader button:hover:not(:disabled) {
    background: var(--offset-background-2);
  }

  #barcode-reader button.primary:hover:not(:disabled) {
    background: var(--scanner-accent-hover);
  }

  #barcode-reader button:disabled {
    cursor: not-allowed;
    opacity: 0.55;
  }

  #barcode-reader button:focus-visible,
  #barcode-reader input:focus-visible {
    outline: 2px solid var(--scanner-accent);
    outline-offset: 2px;
  }

  #barcode-reader .scan-layout {
    display: grid;
    grid-template-columns: minmax(0, 1.1fr) minmax(16rem, 0.9fr);
    gap: 1.5rem;
  }

  #barcode-reader h2 {
    margin-bottom: 0.5rem;
    font-size: 1.15rem;
  }

  #barcode-reader .preview {
    display: grid;
    min-height: 15rem;
    place-items: center;
    overflow: hidden;
    border: 1px dashed var(--border);
    background: var(--offset-background);
  }

  #barcode-reader .preview canvas {
    display: block;
    max-width: 100%;
    max-height: 60vh;
    object-fit: contain;
  }

  #barcode-reader .preview-message {
    padding: 1rem;
    text-align: center;
  }

  #barcode-reader .scan-status {
    min-height: 1.5em;
    margin: 0.6rem 0 0;
    color: var(--text-color);
  }

  #barcode-reader .results-header {
    display: flex;
    align-items: baseline;
    gap: 0.75rem;
    border-bottom: 1px solid var(--border);
  }

  #barcode-reader .results-header h2 {
    margin-bottom: 0.5rem;
  }

  #barcode-reader .result-count {
    color: var(--scanner-accent);
    font-variant-numeric: tabular-nums;
    font-weight: 700;
  }

  #barcode-reader .clear-results {
    margin-left: auto !important;
    min-height: 2rem !important;
    padding: 0.2rem 0.55rem !important;
  }

  #barcode-reader .results-list {
    margin: 0;
    padding-left: 1.75rem;
  }

  #barcode-reader .results-list li {
    display: grid;
    grid-template-columns: 6.5rem minmax(0, 1fr);
    gap: 0.5rem;
    padding: 0.65rem 0.25rem;
    border-bottom: 1px solid var(--border);
  }

  #barcode-reader .barcode-format {
    color: var(--text-color);
    font-size: 0.8rem;
    font-weight: 700;
  }

  #barcode-reader .barcode-value {
    overflow-wrap: anywhere;
    white-space: pre-wrap;
  }

  #barcode-reader .empty-results {
    color: var(--text-color);
  }

  @media (max-width: 42rem) {
    #barcode-reader .scan-layout {
      grid-template-columns: minmax(0, 1fr);
    }

    #barcode-reader .preview {
      min-height: 12rem;
    }

    #barcode-reader .results-list li {
      grid-template-columns: minmax(0, 1fr);
      gap: 0.2rem;
    }
  }
</style>

<section id="barcode-reader" aria-label="Barcode reader">
  <div class="scan-controls">
    <label class="image-control" for="barcode-image">
      <span>Upload image</span>
      <input id="barcode-image" type="file" accept="image/*" disabled />
    </label>
    <input
      id="camera-image"
      type="file"
      accept="image/*"
      capture="environment"
      hidden
      disabled
    />
    <button id="take-photo" class="primary" type="button" disabled>
      Take photo
    </button>
  </div>

  <div class="scan-layout">
    <section aria-labelledby="scan-source-heading">
      <h2 id="scan-source-heading">Scan source</h2>
      <div class="preview">
        <canvas
          id="image-preview"
          role="img"
          aria-label="Selected image"
          hidden
        ></canvas>
        <p id="preview-message" class="preview-message">
          Upload an image or take a photo.
        </p>
      </div>
      <p id="scan-status" class="scan-status" role="status" aria-live="polite">
        Loading barcode detector...
      </p>
    </section>

    <section aria-labelledby="results-heading">
      <div class="results-header">
        <h2 id="results-heading">Results</h2>
        <span id="result-count" class="result-count" aria-live="polite">0</span>
        <button id="clear-results" class="clear-results" type="button">
          Clear
        </button>
      </div>
      <p id="empty-results" class="empty-results">No barcodes found yet.</p>
      <ol id="barcode-results" class="results-list" aria-live="polite"></ol>
    </section>
  </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/@undecaf/zbar-wasm@0.9.15/dist/index.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@undecaf/barcode-detector-polyfill@0.9.23/dist/index.js"></script>
<script>
  (() => {
    const imageInput = document.getElementById("barcode-image");
    const cameraInput = document.getElementById("camera-image");
    const takePhotoButton = document.getElementById("take-photo");
    const clearResultsButton = document.getElementById("clear-results");
    const imagePreview = document.getElementById("image-preview");
    const previewMessage = document.getElementById("preview-message");
    const scanStatus = document.getElementById("scan-status");
    const resultCount = document.getElementById("result-count");
    const emptyResults = document.getElementById("empty-results");
    const resultsList = document.getElementById("barcode-results");

    let detector = null;
    let imageObjectUrl = null;
    let imageScanVersion = 0;

    function setStatus(message) {
      scanStatus.textContent = message;
    }

    function updateResultCount() {
      const count = resultsList.children.length;
      resultCount.textContent = String(count);
      emptyResults.hidden = count !== 0;
    }

    function clearResults() {
      resultsList.replaceChildren();
      updateResultCount();
    }

    function appendBarcode(barcode) {
      const value = String(barcode.rawValue ?? "");
      if (!value) {
        return;
      }

      const item = document.createElement("li");
      const format = document.createElement("span");
      const output = document.createElement("code");
      format.className = "barcode-format";
      format.textContent = String(barcode.format || "barcode")
        .replaceAll("_", " ")
        .toUpperCase();
      output.className = "barcode-value";
      output.textContent = value;
      item.append(format, output);
      resultsList.append(item);
    }

    function selectCameraPhoto() {
      if (detector) {
        cameraInput.click();
      }
    }

    async function scanImage(file) {
      imageScanVersion += 1;
      const version = imageScanVersion;
      clearResults();
      previewMessage.hidden = true;

      if (imageObjectUrl) {
        URL.revokeObjectURL(imageObjectUrl);
      }
      imageObjectUrl = URL.createObjectURL(file);
      const objectUrl = imageObjectUrl;
      imagePreview.hidden = false;
      setStatus("Scanning image...");
      let bitmap = null;

      try {
        const image = new Image();
        await new Promise((resolve, reject) => {
          image.onload = resolve;
          image.onerror = reject;
          image.src = objectUrl;
        });

        if (version !== imageScanVersion) {
          return;
        }

        imagePreview.width = image.naturalWidth;
        imagePreview.height = image.naturalHeight;
        const context = imagePreview.getContext("2d");
        context.drawImage(image, 0, 0);
        let detectionSource = image;
        if (typeof window.createImageBitmap === "function") {
          try {
            bitmap = await window.createImageBitmap(image);
            detectionSource = bitmap;
          } catch (error) {
            detectionSource = image;
          }
        }

        const barcodes = await detector.detect(detectionSource);
        if (version !== imageScanVersion) {
          return;
        }

        for (const barcode of barcodes) {
          appendBarcode(barcode);
        }
        updateResultCount();
        const count = resultsList.children.length;
        setStatus(
          count === 0
            ? "No barcodes found."
            : `${count} barcode${count === 1 ? "" : "s"} found.`,
        );
      } catch (error) {
        if (version === imageScanVersion) {
          imagePreview.hidden = true;
          previewMessage.hidden = false;
          setStatus("This image could not be scanned.");
        }
      } finally {
        if (bitmap) {
          bitmap.close();
        }
        if (imageObjectUrl === objectUrl) {
          URL.revokeObjectURL(objectUrl);
          imageObjectUrl = null;
        }
      }
    }

    function handleImageSelection(event) {
      const input = event.currentTarget;
      const file = input.files && input.files[0];
      input.value = "";
      if (file && detector) {
        scanImage(file);
      }
    }

    imageInput.addEventListener("change", handleImageSelection);
    cameraInput.addEventListener("change", handleImageSelection);
    takePhotoButton.addEventListener("click", selectCameraPhoto);
    clearResultsButton.addEventListener("click", clearResults);

    try {
      if (typeof window.BarcodeDetector === "undefined") {
        const polyfill =
          typeof barcodeDetectorPolyfill === "undefined"
            ? null
            : barcodeDetectorPolyfill.BarcodeDetectorPolyfill;
        if (!polyfill) {
          throw new Error("Barcode detector polyfill did not load.");
        }
        window.BarcodeDetector = polyfill;
      }

      detector = new window.BarcodeDetector();
      imageInput.disabled = false;
      cameraInput.disabled = false;
      takePhotoButton.disabled = false;
      setStatus("Ready.");
    } catch (error) {
      setStatus(
        "Barcode detection could not be loaded. Check the connection and reload.",
      );
    }
  })();
</script>
